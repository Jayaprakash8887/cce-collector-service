# ============================================================
# CCE Collector Service — Local Development Stack
# ============================================================
# Usage:
#   docker compose up -d          (start infrastructure)
#   docker compose down -v        (stop & remove volumes)
# ============================================================

services:
  # ---------- PostgreSQL 16 ----------
  postgres:
    image: postgres:16-alpine
    container_name: cce-collector-postgres
    environment:
      POSTGRES_DB: cce_collector
      POSTGRES_USER: cce_user
      POSTGRES_PASSWORD: cce_pass
    ports:
      - "5433:5432"
    volumes:
      - cce_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cce_user -d cce_collector"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------- Apache Kafka (KRaft — no ZooKeeper) ----------
  kafka:
    image: apache/kafka:3.7.0
    container_name: cce-collector-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  cce_pg_data:
