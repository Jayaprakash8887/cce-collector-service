# ============================================================
# CCE Collector Service — Base Configuration
# ============================================================

server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: cce-collector-service

  # ---------- Jackson ----------
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # ---------- DataSource (PostgreSQL + HikariCP) ----------
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/cce_collector}
    username: ${SPRING_DATASOURCE_USERNAME:cce_user}
    password: ${SPRING_DATASOURCE_PASSWORD:cce_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 30000
      pool-name: cce-collector-pool

  # ---------- JPA / Hibernate ----------
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  # ---------- Flyway ----------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # ---------- Kafka ----------
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: ${SPRING_KAFKA_PRODUCER_ACKS:all}
      retries: ${SPRING_KAFKA_PRODUCER_RETRIES:3}
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 5
        batch.size: 16384

# ---------- Actuator ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# ---------- CCE Collector Settings ----------
cce:
  collector:
    dedup:
      lookback-days: ${CCE_COLLECTOR_DEDUP_LOOKBACK_DAYS:30}
    max-payload-size: ${CCE_COLLECTOR_MAX_PAYLOAD_SIZE:1048576}
    fhir:
      strict-validation: ${CCE_COLLECTOR_FHIR_STRICT_VALIDATION:false}
  kafka:
    topics:
      inbound: ${CCE_COLLECTOR_KAFKA_TOPICS_INBOUND:cce.events.inbound}
    publish-timeout-seconds: ${CCE_COLLECTOR_KAFKA_PUBLISH_TIMEOUT_SECONDS:30}

# ---------- Logging ----------
logging:
  level:
    root: INFO
    org.openphc.cce.collector: INFO
    org.springframework.kafka: WARN
    org.hibernate.SQL: WARN
