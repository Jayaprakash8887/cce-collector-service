# ============================================================
# CCE Collector Service — Production Profile
# ============================================================
# Activate: --spring.profiles.active=production
# Purpose:  Kubernetes pods. Optimized pool sizes, shorter
#           timeouts, JSON structured logging, env-var config.
# Inherits: all other values from application.yml
# ============================================================

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cce_collector}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:20}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:10}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:180000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:300000}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:10000}

  kafka:
    producer:
      retries: ${SPRING_KAFKA_PRODUCER_RETRIES:5}
      properties:
        linger.ms: ${KAFKA_LINGER_MS:10}
        batch.size: ${KAFKA_BATCH_SIZE:32768}

cce:
  kafka:
    publish-timeout-seconds: ${CCE_COLLECTOR_KAFKA_PUBLISH_TIMEOUT_SECONDS:15}
    topic-config:
      replication-factor: ${CCE_COLLECTOR_KAFKA_TOPIC_REPLICATION_FACTOR:3}
      min-insync-replicas: ${CCE_COLLECTOR_KAFKA_TOPIC_MIN_INSYNC_REPLICAS:2}

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    org.openphc.cce.collector: INFO
