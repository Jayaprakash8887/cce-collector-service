# ============================================================
# CCE Collector Service — Test Profile
# ============================================================
# Used by @ActiveProfiles("test") in integration tests.
# Disables Flyway and Kafka to allow unit/context tests to run
# without external infrastructure.
# ============================================================

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: always
      schema-locations: classpath:h2-init.sql

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      properties:
        enable.idempotence: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

management:
  health:
    kafka:
      enabled: false

logging:
  level:
    org.openphc.cce.collector: DEBUG
